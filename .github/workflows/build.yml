name: build

on:
  pull_request:
    paths-ignore:
      - '**.md'
      # NOT '*.txt': that glob also matches CMakeLists.txt and silently skips
      # CI for build-system-only pushes (bit us 2026-08-14).
      - 'id-readme.txt'
      - 'last-upstream-commit.txt'
      - 'prompt.txt'
      - '.gitignore'
      - 'docs/*'
  push:
    branches:
      - main
      - 'refactor/**'
    paths-ignore:
      - '**.md'
      # NOT '*.txt': that glob also matches CMakeLists.txt and silently skips
      # CI for build-system-only pushes (bit us 2026-08-14).
      - 'id-readme.txt'
      - 'last-upstream-commit.txt'
      - 'prompt.txt'
      - '.gitignore'
      - 'docs/*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.3.0). Leave empty for CI-only build.'
        required: false
        default: ''
        type: string

# wasi-sdk version pin lives in .wasi-sdk-version (single source, shared with
# the Dockerfile and WASM.md) — each install step reads it from the checkout.

# Least-privilege default for EVERY job in this workflow. Without this block
# the GITHUB_TOKEN inherits the repository/org default, which is commonly
# read-write on all scopes — so a build job that only ever needs to read the
# checkout was carrying release-write authority for free. Jobs that genuinely
# need more re-declare it at job level; today exactly one does (`release`).
permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ github.event.inputs.version != '' && 'true' || 'false' }}
      version: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v6
        if: github.event.inputs.version != ''
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate version
        if: github.event.inputs.version != ''
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Version must start with vX.Y.Z"
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      # NOTE: the tag is deliberately NOT created here. It used to be tagged
      # and pushed before anything was built, so a failed release build left a
      # dangling tag on origin and retrying the same version required a
      # delete-release round-trip. The release action in each build job
      # (softprops/action-gh-release with tag_name) creates the tag on the
      # first successful upload instead — no build, no tag.

  lint:
    name: Lint (clang-tidy + clang-format)
    needs: [prepare]
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get -qq update
        # The X11/Wayland dev set mirrors the Linux build job: SDL3's source
        # configure refuses a video-less desktop build without it.
        sudo apt-get -y install cmake ninja-build clang-format \
          libssl-dev libopus-dev libopusfile-dev \
          libasound-dev mesa-common-dev libegl-dev libgbm-dev libdrm-dev \
          libxxf86dga-dev libxrandr-dev libxxf86vm-dev libxss-dev \
          libxcursor-dev libxi-dev libxinerama-dev libxfixes-dev \
          libxtst-dev libxrender-dev libxext-dev \
          libxkbcommon-dev libwayland-dev libdecor-0-dev \
          libpipewire-0.3-dev libpulse-dev

    - name: Install clang-tidy 22
      run: |
        # Pinned to major 22 via apt.llvm.org — Ubuntu 24.04's default
        # clang-tidy is 18, and 18-vs-22 disagree on findings (18 flags
        # sizeof-of-pointer patterns 22 no longer does), so developer
        # machines could not predict CI. Pinning CI to what developers run
        # makes a clean local sweep a real green-predictor.
        # clang-format deliberately stays the apt default: bumping it can
        # reflow the committed formatting baseline, which is a separate
        # decision from lint findings.
        # llvm.sh only registers the apt repo + core packages; clang-tidy
        # ships separately in clang-tidy-22, install it explicitly.
        wget -q https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22
        sudo apt-get -y install clang-tidy-22
        sudo ln -sf "$(command -v clang-tidy-22)" /usr/local/bin/clang-tidy
        clang-tidy --version

    - name: Cache SDL3
      uses: actions/cache@v6
      with:
        path: /tmp/sdl3-prefix
        key: sdl3-release-3.4.14-ubuntu24

    - name: Install SDL3
      run: |
        # find_package(SDL3 REQUIRED) — not in Ubuntu 24.04 repos, build from
        # source, pinned to the release the project builds against locally.
        # The installed prefix is cached; a hit skips the ~3 min source build.
        if [ ! -d /tmp/sdl3-prefix ]; then
          git clone --depth 1 --branch release-3.4.14 \
            https://github.com/libsdl-org/SDL.git /tmp/SDL3
          cmake -S /tmp/SDL3 -B /tmp/SDL3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build /tmp/SDL3/build --parallel
          DESTDIR=/tmp/sdl3-stage cmake --install /tmp/SDL3/build
          mv /tmp/sdl3-stage/usr/local /tmp/sdl3-prefix
        fi
        sudo cp -a /tmp/sdl3-prefix/. /usr/local/

    - name: Configure (generate compile_commands.json)
      run: |
        cmake --preset lint
        cp build/lint/compile_commands.json .

    # PR mode: changed-files-only — fast feedback, also matches the
    # "clang-format is on-demand" project policy (legacy drift not gated).
    # Push mode: full-tree sweep — regression gate on already-clean code.
    - name: Determine changed files (PR)
      if: github.event_name == 'pull_request'
      id: changed
      shell: bash
      run: |
        base="${{ github.base_ref }}"
        git fetch origin "$base" --depth=1
        all=$(git diff --name-only --diff-filter=ACMR "origin/$base"...HEAD \
          | grep -E '^code/(cgame|game|qcommon|server|client|botlib|renderer|renderer2|renderercommon|renderervk|sdl|unix|win32)/.*\.(c|h)$' || true)
        c_only=$(echo "$all" | grep -E '\.c$' || true)
        # Use $'\n' delimiter so multiline outputs survive GHA's parser.
        {
          echo "all<<EOF"
          echo "$all"
          echo "EOF"
          echo "c_only<<EOF"
          echo "$c_only"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: clang-format (PR — changed files)
      if: github.event_name == 'pull_request' && steps.changed.outputs.all != ''
      shell: bash
      run: |
        echo "${{ steps.changed.outputs.all }}" | xargs clang-format --dry-run --Werror --style=file

    - name: clang-tidy (PR — changed .c files)
      if: github.event_name == 'pull_request' && steps.changed.outputs.c_only != ''
      shell: bash
      run: |
        fail=0
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          clang-tidy -p . "$f" || fail=1
        done <<< "${{ steps.changed.outputs.c_only }}"
        exit $fail

    - name: clang-tidy (push — full engine + game sweep)
      if: github.event_name != 'pull_request'
      shell: bash
      run: |
        # Parallel sweep across all cores (the serial per-file loop pegged one
        # of the runner's vCPUs and dominated the ~28 min job). xargs exits
        # nonzero if ANY clang-tidy invocation fails, and every file is still
        # processed — the complete finding list survives, same as the old
        # fail-accumulator loop.
        find code/cgame code/game code/qcommon code/server code/client code/sdl \
             code/botlib code/renderer code/renderer2 code/renderervk code/renderercommon \
             -name '*.c' | grep -vE 'sv_rankings\.c|g_rankings\.c' \
          | xargs -P "$(nproc)" -n 1 clang-tidy -p .

  linux-x86_64:
    name: Linux x86_64
    needs: [prepare]
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - uses: actions/setup-go@v7
      with:
        go-version: '1.26.1'
        cache-dependency-path: |
          launcher/go.sum
          tools/quic-probe/go.sum

    - uses: actions/setup-node@v7
      with:
        node-version: '24.19.0'

    - name: Verify QUIC probe
      working-directory: tools/quic-probe
      run: |
        go mod verify
        go test ./...
        go vet ./...
        go build -trimpath ./...

    - name: Install system dependencies
      run: |
        sudo apt-get -qq update
        sudo apt-get -y install cmake ninja-build glslang-tools spirv-tools libssl-dev \
          mesa-common-dev libxxf86dga-dev libxrandr-dev libxxf86vm-dev \
          libasound-dev libxss-dev libxcursor-dev libxi-dev libxinerama-dev \
          libxfixes-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
          libpipewire-0.3-dev libpulse-dev libegl-dev libdrm-dev libgbm-dev \
          libwebkit2gtk-4.1-dev libgtk-3-dev \
          libopus-dev libopusfile-dev
        # clang-22 from apt.llvm.org — same major as the pinned clang-tidy,
        # so the linter and the shipping compiler see the same language view.
        wget -q https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 22

    - name: Cache SDL3
      uses: actions/cache@v6
      with:
        path: /tmp/sdl3-prefix
        key: sdl3-release-3.4.14-ubuntu24

    - name: Install SDL3
      run: |
        # SDL3 is not in Ubuntu 24.04 repos — build from source, pinned to the
        # release the project builds against locally (was: unpinned HEAD).
        # The installed prefix is cached; a hit skips the ~3 min source build.
        if [ ! -d /tmp/sdl3-prefix ]; then
          git clone --depth 1 --branch release-3.4.14 \
            https://github.com/libsdl-org/SDL.git /tmp/SDL3
          cmake -S /tmp/SDL3 -B /tmp/SDL3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build /tmp/SDL3/build --parallel
          DESTDIR=/tmp/sdl3-stage cmake --install /tmp/SDL3/build
          mv /tmp/sdl3-stage/usr/local /tmp/sdl3-prefix
        fi
        sudo cp -a /tmp/sdl3-prefix/. /usr/local/

    - name: Install wasi-sdk
      run: |
        WASI_SDK_VERSION=$(cat .wasi-sdk-version)
        curl -sL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" \
          | sudo tar xz -C /opt
        sudo ln -sf /opt/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux /opt/wasi-sdk

    - name: Install Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

    - name: Build and package
      env:
        RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      # Single-toolchain policy (2026-08-14): shipping builds are clang; the
      # Docker/trixie job stays gcc as the diversity guardian.
      run: CC=clang-22 CXX=clang++-22 make release CHANNEL=public Q3DIR=${{ runner.temp }}/q3now WAILS_TAGS="-tags webkit2_41" ${RELEASE_VERSION:+VERSION=$RELEASE_VERSION}

    - uses: actions/upload-artifact@v7
      if: github.event_name == 'push' || needs.prepare.outputs.is_release == 'true'
      with:
        name: linux-x86_64
        path: build/*.tar.gz
        if-no-files-found: error
        retention-days: 5

    # Publication is NOT done here. This job hands its tarball to the
    # `release` job via the artifact above; see that job for the rationale.

  macos-arm64:
    name: macOS arm64
    needs: [prepare]
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - uses: actions/setup-go@v7
      with:
        go-version: '1.26.1'
        cache-dependency-path: |
          launcher/go.sum
          tools/quic-probe/go.sum

    - uses: actions/setup-node@v7
      with:
        node-version: '24.19.0'

    - name: Verify QUIC probe
      working-directory: tools/quic-probe
      run: |
        go mod verify
        go test ./...
        go vet ./...
        go build -trimpath ./...

    - name: Install system dependencies
      # openssl@3 is a hard configure requirement (picoquic TLS); listed
      # explicitly even though runners preinstall it, so the dependency is
      # visible and survives a runner-image change.
      run: brew install cmake ninja glslang spirv-tools sdl3 molten-vk openssl@3 create-dmg opus opusfile

    - name: Install wasi-sdk
      run: |
        WASI_SDK_VERSION=$(cat .wasi-sdk-version)
        curl -sL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-arm64-macos.tar.gz" \
          | sudo tar xz -C /opt
        sudo ln -sf /opt/wasi-sdk-${WASI_SDK_VERSION}.0-arm64-macos /opt/wasi-sdk

    - name: Install Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

    - name: Build and package
      env:
        RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      run: make release CHANNEL=public Q3DIR=${{ runner.temp }}/q3now.app ${RELEASE_VERSION:+VERSION=$RELEASE_VERSION}

    - uses: actions/upload-artifact@v7
      if: github.event_name == 'push' || needs.prepare.outputs.is_release == 'true'
      with:
        name: macos-arm64-dmg
        path: build/*.dmg
        if-no-files-found: error
        retention-days: 5

    # Publication is NOT done here — see the `release` job.

  windows-x86_64:
    name: Windows x86_64
    # Engine binaries come from the cross-windows artifact (single-toolchain
    # plan, step D): this job only builds the launcher and packages the zip.
    needs: [prepare, cross-windows]
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Fetch release tag
      if: needs.prepare.outputs.is_release == 'true'
      shell: bash
      run: git fetch --tags

    - uses: actions/setup-go@v7
      with:
        go-version: '1.26.1'
        # cache: false — GOCACHE stores cgo link flags computed under the old
        # MINGW64 prefix; the go.sum-derived key never changes, so the stale
        # -L/mingw64/lib kept resurrecting after the CLANG64 switch.
        cache: false

    - uses: actions/setup-node@v7
      with:
        node-version: '24.19.0'

    - name: Verify QUIC probe
      working-directory: tools/quic-probe
      run: |
        go mod verify
        go test ./...
        go vet ./...
        go build -trimpath ./...

    - name: Install system dependencies
      run: choco install ninja -y

    - uses: msys2/setup-msys2@v2
      with:
        # CLANG64: single-toolchain policy (2026-08-14) — the packaging build
        # compiles with clang like every other lane. The clang64 repo carries
        # the same library set under the mingw-w64-clang-x86_64-* prefix and
        # the environment provides cc/gcc shims pointing at clang.
        msystem: CLANG64
        update: false
        install: >-
          mingw-w64-clang-x86_64-toolchain
          mingw-w64-clang-x86_64-cmake
          mingw-w64-clang-x86_64-openssl
          mingw-w64-clang-x86_64-opus
          mingw-w64-clang-x86_64-opusfile
          mingw-w64-clang-x86_64-pkg-config
          mingw-w64-clang-x86_64-sdl3
        path-type: inherit

    - name: Download engine artifacts
      uses: actions/download-artifact@v8
      with:
        name: cross-windows-x86_64
        path: build

    - name: Download test executables
      uses: actions/download-artifact@v8
      with:
        name: cross-windows-tests
        path: tests-bin

    # Run the cross-built test executables BEFORE packaging: binaries whose
    # tests fail never reach the zip. (Script-based cmake -P policy checks
    # already run in the Linux/mac jobs.)
    - name: Run tests
      shell: bash
      run: |
        cd tests-bin
        fail=0
        for t in *_test.exe; do
          echo "== $t"
          ./"$t" || { echo "FAILED: $t"; fail=1; }
        done
        exit $fail

    - name: Install wasi-sdk
      shell: pwsh
      run: |
        $env:WASI_SDK_VERSION = (Get-Content .wasi-sdk-version -Raw).Trim()
        $url = "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$env:WASI_SDK_VERSION/wasi-sdk-$env:WASI_SDK_VERSION.0-x86_64-windows.tar.gz"
        $archive = "$env:RUNNER_TEMP\wasi-sdk.tar.gz"
        Invoke-WebRequest -Uri $url -OutFile $archive
        New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\wasi-sdk"
        tar xzf $archive --strip-components=1 -C "$env:USERPROFILE\wasi-sdk"

    - name: Install Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

    - name: Build and package
      shell: bash
      env:
        OPENSSL_ROOT_DIR: "${{ runner.temp }}/msys64/clang64"
      # PATH adjustments and quirks:
      #
      # (1) Strawberry Perl is preinstalled on windows-2025 runners and ships
      #     a broken pkg-config.bat that bails out with "Can't find … on
      #     PATH, '.' not in PATH." regardless of what's actually being
      #     queried. Wails' `Generating bindings` step invokes CGo on
      #     gopkg.in/hraban/opus.v2 which calls pkg-config; Strawberry's
      #     wrapper is found first and fails. Prepend MSYS2's clang64/bin
      #     so the real pkg-config.exe (which can find opus.pc / opusfile.pc
      #     installed via mingw-w64-x86_64-{opus,opusfile,pkg-config}) wins.
      #
      # (2) USERPROFILE arrives as Windows-form (C:\Users\...); CMake's
      #     parser interprets backslashes in -D values as escape sequences
      #     (\U, \r) and corrupts the path. Convert \ → / via bash parameter
      #     expansion so cmake sees a clean forward-slash path.
      run: |
        export PATH="${{ runner.temp }}/msys64/clang64/bin:$PATH"
        # Not running inside an MSYS2 shell, so MSYSTEM is unset and pkgconf
        # falls back to its mingw64 personality — point it (and the launcher's
        # cgo link) at the clang64 prefix explicitly.
        export MSYSTEM=CLANG64
        # RUNNER_TEMP is Windows-form (D:\a\_temp); pkgconf can't walk a
        # backslash path from bash — convert \ -> / first (same treatment
        # WASI_HOME gets below).
        MSYS_ROOT="${RUNNER_TEMP//\\//}/msys64"
        export PKG_CONFIG_PATH="$MSYS_ROOT/clang64/lib/pkgconfig"
        # cgo must use the SAME toolchain as the libraries it links: the
        # runner's preinstalled C:\mingw64 gcc mixes its crt2.o with clang64's
        # runtime and dies on __mingw_oldexcpt_handler. clang64/bin is first
        # in PATH, so plain "clang" resolves to the right one.
        export CC=clang CXX=clang++
        # Belt and braces: something in the wails/go chain resolves the bare
        # name "gcc" from PATH (ignoring $CC) and was landing on the runner's
        # preinstalled C:\mingw64. clang64 ships no gcc.exe, so give it one —
        # clang invoked as "gcc" runs its gcc-compatible driver.
        cp "$MSYS_ROOT/clang64/bin/clang.exe" "$MSYS_ROOT/clang64/bin/gcc.exe"
        WASI_HOME="${USERPROFILE//\\//}/wasi-sdk"
        RELEASE_VERSION="${{ needs.prepare.outputs.version }}"
        make release WIRED_PREBUILT=1 SKIP_HOST_TESTS=1 CHANNEL=public Q3DIR=dist/q3now ${RELEASE_VERSION:+VERSION=$RELEASE_VERSION}

    - uses: actions/upload-artifact@v7
      if: github.event_name == 'push' || needs.prepare.outputs.is_release == 'true'
      with:
        name: windows-x86_64-zip
        path: build/*.zip
        if-no-files-found: error
        retention-days: 5

    # Publication is NOT done here — see the `release` job.

  docker:
    name: Docker image
    needs: [prepare]
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: eserozvataf/q3now
        tags: |
          type=sha
          type=ref,event=branch
          type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

    - uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      if: github.event_name == 'push' || needs.prepare.outputs.is_release == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.event_name == 'push' || needs.prepare.outputs.is_release == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  cross-windows:
    name: Linux → Windows x86_64 (llvm-mingw)
    needs: [prepare]
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - uses: docker/setup-buildx-action@v4

    - name: Build toolchain image
      uses: docker/build-push-action@v7
      with:
        context: docker/cross-windows
        tags: wired-cross-windows
        load: true
        cache-from: type=gha,scope=cross-windows
        cache-to: type=gha,scope=cross-windows,mode=max

    - name: Cross build
      run: docker run --rm -v "$PWD:/src" wired-cross-windows /src/docker/cross-windows/build.sh

    - uses: actions/upload-artifact@v7
      with:
        name: cross-windows-x86_64
        path: |
          build/cross-windows-docker/wired*.exe
          build/cross-windows-docker/*.dll
          build/cross-windows-docker/Release/base/*.dll
          build/cross-windows-docker/Release/base/vm/*.wasm
        if-no-files-found: error

    # Step B of the single-toolchain plan: the cross lane also builds the
    # host-test executables; a Windows runner job will download and execute
    # them (step C), replacing the native MinGW-gcc test build.
    - uses: actions/upload-artifact@v7
      with:
        name: cross-windows-tests
        # Everything except the tests that READ PROJECT SOURCE FILES.
        #
        # Those are source-text contracts: they assert that production code
        # still contains a particular construct, so a guarantee cannot be
        # deleted without something noticing. Reading the source IS the test,
        # and the path is baked in at compile time — which makes them meaningful
        # only on the machine that compiled them.
        #
        # Shipped to the Windows runner they read nothing and report a content
        # failure that looks like a real defect: "FAIL: compositor source is
        # non-empty -> got 0, want 1". They still run on every host that builds
        # them, via ctest, where the path is correct.
        #
        # Excluded by name rather than by a naming convention because the list
        # is short and explicit beats clever here: a new source-contract test
        # that forgets this line fails loudly on Windows, which is a better
        # outcome than one silently skipped by a pattern.
        path: |
          build/cross-windows-docker/*_test.exe
          !build/cross-windows-docker/bg_animated_emitter_test.exe
          !build/cross-windows-docker/bg_emit_budget_test.exe
          !build/cross-windows-docker/bg_layer_zorder_test.exe
          !build/cross-windows-docker/particle_curve_test.exe
          !build/cross-windows-docker/playtest_envelope_test.exe
        if-no-files-found: error

  # Single downstream publisher. Previously the Linux, macOS and Windows jobs
  # each ran softprops/action-gh-release against the SAME tag_name, so three
  # concurrently-finishing runners raced to create one release: whichever won
  # created the tag and the notes, and the losers' create-then-upload could
  # collide mid-flight. Worse, the outcome was order-dependent — a release
  # could be published, and its tag created, while a sibling platform was
  # still building or about to fail, leaving a public half-release.
  #
  # Collapsing publication into one job that runs only after all three
  # platforms succeed makes the release atomic in the way that matters: the
  # tag is not created unless every platform produced a shippable artifact,
  # and exactly one actor ever writes to the release.
  #
  # This is also the only job in the workflow holding `contents: write`. The
  # build jobs now run read-only under the top-level default.
  #
  # STATUS: configured, unverified. No real versioned dispatch has ever run
  # this path (the `version` input has never been exercised end to end), so
  # the publication itself remains unproven — see the task notes.
  release:
    name: Publish release
    needs: [prepare, linux-x86_64, macos-arm64, windows-x86_64]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    # The single grant of external-write authority in this workflow: creating
    # the tag and the GitHub Release requires contents: write.
    permissions:
      contents: write

    steps:
    # Each platform artifact lands in its own subdirectory, then a single
    # glob collects them. Downloading into one flat directory would let a
    # future same-named file from two platforms silently overwrite.
    - name: Download release artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: '{linux-x86_64,macos-arm64-dmg,windows-x86_64-zip}'
        path: dist

    - name: Collect payload
      shell: bash
      run: |
        mkdir -p upload
        # Fail closed: if a platform's payload is missing or the glob comes
        # back empty, publish nothing rather than a partial release.
        # `mv {} upload/` rather than GNU-only `mv -t`, so this step does not
        # depend on coreutils flavour if the runner image ever changes.
        find dist -type f \( -name '*.tar.gz' -o -name '*.dmg' -o -name '*.zip' \) \
          -exec mv {} upload/ \;
        ls -l upload
        for ext in tar.gz dmg zip; do
          count=$(find upload -type f -name "*.$ext" | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No .$ext artifact present — refusing to publish a partial release"
            exit 1
          fi
        done

    - name: Publish
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.prepare.outputs.version }}
        name: ${{ needs.prepare.outputs.version }}
        generate_release_notes: true
        files: upload/*
        fail_on_unmatched_files: true
