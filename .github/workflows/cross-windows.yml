# Linux → Windows x86_64 cross build with llvm-mingw (clang), the clang-based
# successor of the classic ioq3 mingw-gcc cross recipe. A toolchain probe
# lane, not a release lane: runs on manual dispatch (default-branch only,
# GitHub limitation) and on pushes that touch the cross toolchain itself.
name: cross-windows

on:
  workflow_dispatch:
  push:
    paths:
      - docker/cross-windows/**
      - cmake/toolchains/**
      - .github/workflows/cross-windows.yml
      - patches/picoquic-mingw/**
      # WAMR compiles into the cross build's engine; its platform/windows
      # files are exactly where case-sensitivity bites (PathCch.h, 2026-08-14).
      - src/libs/wamr/**

jobs:
  cross-windows:
    name: Linux → Windows x86_64 (llvm-mingw)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Build toolchain image
      run: docker build -t wired-cross-windows docker/cross-windows

    - name: Cross build
      run: docker run --rm -v "$PWD:/src" wired-cross-windows /src/docker/cross-windows/build.sh

    - uses: actions/upload-artifact@v7
      with:
        name: cross-windows-x86_64
        path: |
          build/cross-windows-docker/*.exe
          build/cross-windows-docker/*.dll
          build/cross-windows-docker/Release/base/vm/*.wasm
        if-no-files-found: error
