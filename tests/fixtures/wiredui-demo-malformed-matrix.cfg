wui_menu_nav enter
wait 60
com_errorMessage
wui_store_get ui_errorRetry
wui_menu_nav focus btn_back
wui_menu_nav enter
wait 20
com_errorMessage
echo Q0_MALFORMED_MATRIX_CASE_0
wait 10

// generation 3, row 1: truncated sequence
